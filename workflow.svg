<svg xmlns="http://www.w3.org/2000/svg" width="400" height="314" viewBox="0 0 400 314" role="img" aria-labelledby="title desc">
  <title id="title">The four phases of phone porting</title>
  <desc id="desc">Set up the port. For a failure, capture evidence before research; for a new capability, go straight from setup to research. Research-only work ends with a host-only gate report. Otherwise, test and verify after authorization and gate checks. A refuted trial returns to research.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0L8 4L0 8Z" fill="#758195"/>
    </marker>
  </defs>
  <g fill="none" stroke="#758195" stroke-width="2" marker-end="url(#arrow)">
    <path d="M113 52V90"/>
    <path d="M113 134V172"/>
    <path d="M113 216V254"/>
    <path d="M214 30H389V182H214"/>
    <path d="M214 194H240"/>
    <path d="M214 283H389V206H214"/>
  </g>
  <g fill="#eaf0f7" stroke="#758195">
    <rect x="12" y="8" width="202" height="44" rx="8"/>
    <rect x="12" y="90" width="202" height="44" rx="8"/>
    <rect x="12" y="172" width="202" height="44" rx="8"/>
    <rect x="12" y="254" width="202" height="52" rx="8"/>
  </g>
  <g fill="#203048" font-family="system-ui, sans-serif" font-size="16" font-weight="600" text-anchor="middle">
    <text x="113" y="36">0 · Set up the port</text>
    <text x="113" y="118">1 · Capture evidence</text>
    <text x="113" y="200">2 · Research</text>
    <text x="113" y="276">3 · Test and verify</text>
  </g>
  <g fill="#f0f3f8">
    <rect x="32" y="60" width="65" height="22" rx="4"/>
    <rect x="13" y="224" width="84" height="22" rx="4"/>
    <rect x="229" y="42" width="113" height="22" rx="4"/>
    <rect x="248" y="183" width="129" height="22" rx="4"/>
    <rect x="226" y="248" width="151" height="22" rx="4"/>
  </g>
  <g fill="#203048" font-family="system-ui, sans-serif" font-size="13" text-anchor="middle">
    <text x="64.5" y="75">Failure</text>
    <text x="55" y="239">Gates pass</text>
    <text x="285.5" y="57">New capability</text>
    <text x="312.5" y="198">Host-only report</text>
    <text x="301.5" y="263">Refuted: research again</text>
    <text x="113" y="293">One authorized change</text>
  </g>
</svg>
